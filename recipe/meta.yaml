{% set name = "nltk" %}
{% set version = "3.10.4" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 44679f4e9220abfd496d2c8cdb22f8425ccbe557604f9aa5cacb1c44003dabc1

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - nltk = nltk.cli:cli

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    - defusedxml
    - click
    - joblib
    - regex >=2021.8.3
    - tqdm

# The tests are the ones installed with the package, by choice. The wheel
# ships only some of nltk's tests: the doctests (nltk/test/*.doctest),
# conftest.py and a few fixtures. It does not ship nltk/test/unit (the unit
# tests, excluded in upstream's setup.py) or nltk/test/pytest.ini (so the
# doctest options are passed on the command line below), and it lacks a few
# data files some doctests read (e.g. FX8.xml). Running only what is
# installed keeps the test requirements to pytest and pytest-mock; the unit
# tests would need numpy, pyparsing, pyyaml, scikit-learn, python-crfsuite,
# pytest-xdist, ... and a long list of ignored/deselected tests.
#
# The doctests below are ignored because they fail here:
# E         Resource 'x' not found. Please use the NLTK Downloader to obtain the resource:
# E         >>> import nltk
# E         >>> nltk.download('x')
# i.e. they need nltk_data corpora/models, which CI does not fetch (upstream's
# CI runs nltk.download('all')); exceptions are noted next to each.
# bnc.doctest reads FX8.xml, which the wheel does not include
{% set ignore_tests = " --ignore=nltk/test/bnc.doctest" %}
# chat80.doctest needs the chat80 and city_database corpora
{% set ignore_tests = ignore_tests + " --ignore=nltk/test/chat80.doctest" %}
{% set ignore_tests = ignore_tests + " --ignore=nltk/test/collocations.doctest" %}
{% set ignore_tests = ignore_tests + " --ignore=nltk/test/concordance.doctest" %}
# corpus.doctest also needs mdit-plain, not on pkgs/main
{% set ignore_tests = ignore_tests + " --ignore=nltk/test/corpus.doctest" %}
{% set ignore_tests = ignore_tests + " --ignore=nltk/test/crubadan.doctest" %}
{% set ignore_tests = ignore_tests + " --ignore=nltk/test/data.doctest" %}
{% set ignore_tests = ignore_tests + " --ignore=nltk/test/dependency.doctest" %}
{% set ignore_tests = ignore_tests + " --ignore=nltk/test/drt.doctest" %}
{% set ignore_tests = ignore_tests + " --ignore=nltk/test/featgram.doctest" %}
{% set ignore_tests = ignore_tests + " --ignore=nltk/test/framenet.doctest" %}
{% set ignore_tests = ignore_tests + " --ignore=nltk/test/gluesemantics.doctest" %}
{% set ignore_tests = ignore_tests + " --ignore=nltk/test/grammartestsuites.doctest" %}
{% set ignore_tests = ignore_tests + " --ignore=nltk/test/japanese.doctest" %}
{% set ignore_tests = ignore_tests + " --ignore=nltk/test/lm.doctest" %}
{% set ignore_tests = ignore_tests + " --ignore=nltk/test/meteor.doctest" %}
{% set ignore_tests = ignore_tests + " --ignore=nltk/test/parse.doctest" %}
{% set ignore_tests = ignore_tests + " --ignore=nltk/test/propbank.doctest" %}
{% set ignore_tests = ignore_tests + " --ignore=nltk/test/relextract.doctest" %}
{% set ignore_tests = ignore_tests + " --ignore=nltk/test/semantics.doctest" %}
{% set ignore_tests = ignore_tests + " --ignore=nltk/test/sentiment.doctest" %}
{% set ignore_tests = ignore_tests + " --ignore=nltk/test/sentiwordnet.doctest" %}
{% set ignore_tests = ignore_tests + " --ignore=nltk/test/stem.doctest" %}
{% set ignore_tests = ignore_tests + " --ignore=nltk/test/tag.doctest" %}
{% set ignore_tests = ignore_tests + " --ignore=nltk/test/tokenize.doctest" %}
# toolbox.doctest writes a tempfile under /tmp, which nltk's own pathsec
# sandbox rejects as an unauthorized path (PermissionError), so open() never
# succeeds (it passes where the temp dir is private, e.g. macOS)
{% set ignore_tests = ignore_tests + " --ignore=nltk/test/toolbox.doctest" %}
{% set ignore_tests = ignore_tests + " --ignore=nltk/test/translate.doctest" %}
{% set ignore_tests = ignore_tests + " --ignore=nltk/test/tree.doctest" %}
{% set ignore_tests = ignore_tests + " --ignore=nltk/test/wordnet.doctest" %}
{% set ignore_tests = ignore_tests + " --ignore=nltk/test/wordnet_lch.doctest" %}
{% set ignore_tests = ignore_tests + " --ignore=nltk/test/wsd.doctest" %}

test:
  imports:
    - nltk
    - nltk.app
    - nltk.ccg
    - nltk.chat
    - nltk.chunk
    - nltk.classify
    - nltk.cluster
    - nltk.corpus
    - nltk.corpus.reader
    - nltk.draw
    - nltk.inference
    - nltk.lm
    - nltk.metrics
    - nltk.misc
    - nltk.parse
    - nltk.sem
    - nltk.sentiment
    - nltk.stem
    - nltk.tag
    - nltk.tbl
    - nltk.test
    - nltk.tokenize
    - nltk.translate
    - nltk.twitter
  requires:
    - pip
    # tqdm and click requires colorama
    - colorama  # [win]
    - pytest >=6.0.1
    # nltk/test/conftest.py has an autouse fixture that uses `mocker`
    - pytest-mock
    # Not added: numpy, pyparsing, pyyaml, scikit-learn, python-crfsuite,
    # twython, gensim. With them the installed tests gain at most one doctest
    # (metrics.doctest, numpy); the rest only matter for the unit tests, which
    # the wheel does not include.
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    # Run the installed tests from site-packages so `import nltk` resolves to
    # the built artifact. The doctest options normally come from the
    # pytest.ini that the wheel lacks (see above), hence the explicit flags.
    - cd "$SP_DIR" && pytest -rsx "--doctest-glob=*.doctest" --doctest-continue-on-failure -o "doctest_optionflags=ELLIPSIS NORMALIZE_WHITESPACE IGNORE_EXCEPTION_DETAIL" nltk/test {{ ignore_tests }}  # [unix]
    - cd /d "%SP_DIR%" && pytest -rsx "--doctest-glob=*.doctest" --doctest-continue-on-failure -o "doctest_optionflags=ELLIPSIS NORMALIZE_WHITESPACE IGNORE_EXCEPTION_DETAIL" nltk/test {{ ignore_tests }}  # [win]
    - nltk -h

about:
  home: https://www.nltk.org
  license_file: LICENSE.txt
  license: Apache-2.0
  license_family: Apache
  summary: Natural Language Toolkit.
  description: |
    NLTK has been called a wonderful tool for teaching and working in
    computational linguistics using Python and an amazing library to play with
    natural language.
  dev_url: https://github.com/nltk/nltk
  doc_url: https://www.nltk.org

extra:
  recipe-maintainers:
    - pmlandwehr
    - quartox
