{% set name = "nltk" %}
{% set version = "3.10.4" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 44679f4e9220abfd496d2c8cdb22f8425ccbe557604f9aa5cacb1c44003dabc1

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - nltk = nltk.cli:cli

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    - defusedxml
    - click
    - joblib
    - regex >=2021.8.3
    - tqdm

