test:
  source_files:
    - nltk/test
  imports:
    - nltk
    - nltk.app
    - nltk.ccg
    - nltk.chat
    - nltk.chunk
    - nltk.classify
    - nltk.cluster
    - nltk.corpus
    - nltk.corpus.reader
    - nltk.draw
    - nltk.inference
    - nltk.lm
    - nltk.metrics
    - nltk.misc
    - nltk.parse
    - nltk.sem
    - nltk.sentiment
    - nltk.stem
    - nltk.tag
    - nltk.tbl
    - nltk.test
    - nltk.tokenize
    - nltk.translate
    - nltk.twitter
  requires:
    - pip
    # tqdm and click requires colorama
    - colorama  # [win]
    - pytest >=6.0.1
    - numpy
    - pytest-mock
    - pytest-xdist
    - pyparsing
    # upstream requirements-ci.txt: yaml-bomb/allowlist attack tests import yaml
    - pyyaml
    # optional deps from upstream requirements-ci.txt / extras.
    # test-only, so they are not run requirements.
    - pandas
    - scipy
    - scikit-learn
    - matplotlib
    - python-crfsuite
    # twython is NOT added: it is not available on pkgs/main, so the twitter
    # tests needing it (and requests) are deselected above.
    # gensim is NOT added: gensim.doctest needs the brown corpus, which the
    # no-data CI regime does not fetch, so the file keeps skipping as before.
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    # Stage the source test tree (incl. nltk/test/unit, which the wheel
    # excludes) onto the installed package, then run pytest from there so
    # `import nltk` resolves to the built artifact, not $SRC_DIR.
    - python -c "import os, shutil, sysconfig; shutil.copytree(os.path.join(os.environ['SRC_DIR'], 'nltk', 'test'), os.path.join(sysconfig.get_paths()['purelib'], 'nltk', 'test'), dirs_exist_ok=True)"
    # -n auto/-rsx match upstream's CI invocation; no -vv (at verbosity >= 1
    # the terminal reporter crashes on tests that monkeypatch os.name)
    # MPLBACKEND=Agg: matplotlib needs a headless backend on CI (no display)
    - cd "$SP_DIR" && MPLBACKEND=Agg pytest -rsx -n auto nltk/test {{ ignore_tests }} {{ deselect_tests }}  # [unix]
    - cd /d "%SP_DIR%" && set "MPLBACKEND=Agg" && pytest -rsx -n auto nltk/test {{ ignore_tests }} {{ deselect_tests }}  # [win]
    - nltk -h

